<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -30 140 60" width="140" height="60">
  <defs>
    <filter id="batShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#batShadow)">
    <!-- ALA IZQUIERDA (Facetas 3D Origami) -->
    <!-- Faceta exterior izquierda (punta de ala) -->
    <path d="M -36 -19 C -46 -19 -58 -16 -66 -12 C -54 -4 -46 0 -42 6 Z" fill="#0d0d12" />
    
    <!-- Faceta interior superior izquierda (hombro) -->
    <polygon points="-6 -14, -18 -4, -36 -19, -42 6" fill="#2b2b34" />
    
    <!-- Faceta interior inferior izquierda (membrana) -->
    <path d="M -6 -14 L -42 6 C -32 4 -20 6 -5 7 Z" fill="#1e1e24" />

    <!-- ALA DERECHA (Facetas 3D Origami - Sombra opuesta) -->
    <!-- Faceta exterior derecha (punta de ala) -->
    <path d="M 36 -19 C 46 -19 58 -16 66 -12 C 54 -4 46 0 42 6 Z" fill="#050508" />
    
    <!-- Faceta interior superior derecha (hombro) -->
    <polygon points="6 -14, 18 -4, 36 -19, 42 6" fill="#141418" />
    
    <!-- Faceta interior inferior derecha (membrana) -->
    <path d="M 6 -14 L 42 6 C 32 4 20 6 5 7 Z" fill="#0a0a0e" />

    <!-- CUERPO Y CABEZA (Fila central dividida en 2 facetas geométricas) -->
    <!-- Lado izquierdo del cuerpo (iluminado) -->
    <polygon points="0 -16, -6 -23, -6 -14, -5 7, 0 24" fill="#262630" />

    <!-- Lado derecho del cuerpo (en sombra) -->
    <polygon points="0 -16, 6 -23, 6 -14, 5 7, 0 24" fill="#0e0e13" />
  </g>
</svg>
