  <circle cx="32" cy="5" r="4.5" fill="#06b6d4" stroke="#164e63" stroke-width="1"/>
  <circle cx="54" cy="12" r="3.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="22" cy="37" r="2" fill="#10b981"/>
  <circle cx="32" cy="37" r="2.5" fill="#ec4899"/>
  <circle cx="42" cy="37" r="2" fill="#10b981"/>
</svg>
