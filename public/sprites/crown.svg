  <!-- Crown body -->
  <path d="M 6,40 L 58,40 L 60,34 L 54,14 L 40,24 L 32,6 L 24,24 L 10,14 L 4,34 Z" fill="url(#crownGold)" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round" filter="url(#crownShadow)"/>
