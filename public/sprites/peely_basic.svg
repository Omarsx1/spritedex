<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  
  <path d="M 95 20 Q 100 5 105 20 Z" fill="#84cc16" /><path d="M 70 80 Q 100 130 130 80 Z" fill="#fef08a" opacity="0.3" />
