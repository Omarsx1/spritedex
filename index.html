<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sin maximum-scale ni user-scalable=no: bloquear el zoom es un problema de
         accesibilidad y Google lo señala en la validacion movil. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Spritedex de Fortnite: Rastrear capturas, variantes, niveles 1 al 5, clasificar por generaciones y exportar tarjetas para compartir en redes sociales." />
    <link rel="canonical" href="https://spritedex.gg/" />

    <!-- Idiomas: la raiz es la version española y /en la inglesa -->
    <link rel="alternate" hreflang="es" href="https://spritedex.gg/" />
    <link rel="alternate" hreflang="en" href="https://spritedex.gg/en" />
    <link rel="alternate" hreflang="x-default" href="https://spritedex.gg/" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Tarjeta al compartir el enlace (WhatsApp, X, Discord...), ya con dominio propio -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spritedex" />
    <meta property="og:url" content="https://spritedex.gg/" />
    <meta property="og:title" content="Spritedex — Espíritus de Fortnite" />
    <meta property="og:description" content="Rastrea tus espíritus de Fortnite: capturas, variantes, niveles del 1 al 5, comparación con amigos y tarjetas listas para compartir." />
    <meta property="og:image" content="https://spritedex.gg/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spritedex — Espíritus de Fortnite" />
    <meta name="twitter:description" content="Rastrea tus espíritus de Fortnite: capturas, variantes, niveles del 1 al 5, comparación con amigos y tarjetas listas para compartir." />
    <meta name="twitter:image" content="https://spritedex.gg/icon-512.png" />
    
    <!-- Google Fonts (Inter & Outfit) para renderizado nítido en UI y Canvas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- PWA & iOS Safari Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spritedex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060714" />
    <!-- El fondo va en linea para que el primer pintado NUNCA sea blanco: en iOS el
         navegador alcanza a pintar antes de que llegue la hoja de estilos y se ve un
         fogonazo blanco al recargar. El tema de temporada lo sobreescribe por clase. -->
    <style>html { background-color: #060714; }</style>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Spritedex — Espíritus de Fortnite</title>
  </head>
  <body>
    <!-- Tema de temporada ANTES del primer pintado.
         React enciende el tema en un efecto (FortnitemaresTransition), o sea despues del
         primer fotograma: quien ya vio la cinematica alcanzaba a ver la interfaz antigua
         durante un parpadeo. Aqui se decide sin esperar al bundle.
         Las dos fronteras y la clave del intro son las de src/config/seasonalEvent.js, y
         tests/fnm-arranque.test.js impide que se separen. -->
    <script>
      (function () {
        try {
          var host = location.hostname;
          var local = host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '' || /\.(local|localhost)$/.test(host);
          var params = new URLSearchParams(location.search);

          if (local) {
            // Espejo del modo desarrollo de seasonalEvent.js: bandera > override > encendido.
            // Asi el parpadeo tampoco se ve en local y las banderas siguen mandando.
            if (params.has('intro')) return;
            var flag = params.get('halloween');
            if (flag === null) flag = params.get('fortnitemares');
            if (flag === '0' || flag === 'false') return;
            if (flag !== '1' && flag !== 'true') {
              var override = null;
              try { override = localStorage.getItem('spritedex_halloween_override'); } catch (e) {}
              if (override === 'false') return;
            }
          } else {
            var ahora = Date.now();
            if (ahora < new Date('2026-10-01T00:00:00-05:00').getTime()) return;
            if (ahora >= new Date('2026-11-04T00:00:00-05:00').getTime()) return;
          }

          // Con la cinematica pendiente el tema lo enciende ella: adelantarlo mostraria el
          // tema encendido y apagado justo antes de la funcion.
          var vioIntro = false;
          try { vioIntro = localStorage.getItem('spritedex_fortnitemares_intro_seen_v1') === 'true'; } catch (e) {}
          var quieto = false;
          try { quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
          if (!vioIntro && !quieto) return;

          document.documentElement.classList.add('theme-fortnitemares');
          document.body.classList.add('theme-fortnitemares');
        } catch (e) {}
      })();
    </script>
    <!-- El bosque de la temporada, montado en el armazon y no en React: asi existe ya en
         el primer fotograma para quien vio la cinematica. Su visibilidad la decide el CSS:
         sin la clase del tema no se ve, que es lo que mantiene intacta la cinematica de
         los nuevos (ven la rejilla hasta la parte "ground"). -->
    <div class="fnm-forest" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
