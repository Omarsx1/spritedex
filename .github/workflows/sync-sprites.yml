name: Sincronización Automática de Espíritus

on:
  schedule:
    # JUEVES: Cada hora en la mañana pico (5, 6, 7, 8, 9, 10, 11 AM y 12, 1 PM local UTC-5) + tarde (3 y 5 PM)
    - cron: '0 10,11,12,13,14,15,16,17,18,20,22 * * 4'
    # JUEVES NOCHE: 7:00 p. m. y 9:00 p. m. (hora local UTC-5)
    - cron: '0 0,2 * * 5'
    # RESTO DE LA SEMANA: 2 revisiones diarias a las 10:00 a. m. y 4:00 p. m. (hora local UTC-5)
    - cron: '0 15,21 * * 0,1,2,3,6'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub Actions

permissions:
  contents: write

jobs:
  sync-sprites:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@latest
        id: setup-chrome

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar sincronización de espíritus
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/sync-sprites.js

      - name: Validar integridad con OxLint
        run: npx oxlint --deny=error

      - name: Validar compilación con Vite
        run: pnpm run build

      - name: Guardar y pushear cambios si hay novedades
        run: |
          if [ -n "$(git status --porcelain src/data/ public/sprites/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/ public/sprites/
            git commit -m "Actualiza catálogo de espíritus desde fortnite.gg"

            CURRENT_BRANCH="${GITHUB_REF_NAME:-dev}"
            echo "Pusheando a rama $CURRENT_BRANCH..."
            git push origin "$CURRENT_BRANCH"

            # Mantener dev y main sincronizados
            if [ "$CURRENT_BRANCH" = "dev" ]; then
              echo "Sincronizando con rama main..."
              git fetch origin main
              git checkout main
              git merge dev -m "Merge dev: Actualiza catálogo de espíritus desde fortnite.gg"
              git push origin main
              git checkout dev
            elif [ "$CURRENT_BRANCH" = "main" ]; then
              echo "Sincronizando con rama dev..."
              git fetch origin dev
              git checkout dev
              git merge main -m "Merge main: Actualiza catálogo de espíritus desde fortnite.gg"
              git push origin dev
              git checkout main
            fi
            echo "✅ Catálogo sincronizado y cambios subidos con éxito."
          else
            echo "ℹ️ No hay cambios en el catálogo. Todo al día."
          fi
